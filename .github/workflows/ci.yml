name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Static rules
        run: python3 research-tools/validate.py
      - name: Every rule still fires
        run: python3 research-tools/test_validate.py
      - name: Figures the corpus claims about itself
        run: python3 research-tools/figures_check.py
      - name: Every figure check still fires
        run: python3 research-tools/test_figures.py
      - name: The pre-commit hook checks what is committed
        run: python3 research-tools/test_hook.py
      - name: refute and engine fail closed, against stub engines
        run: python3 research-tools/test_engine.py
      - name: Delivered blocks are current
        run: |
          python3 research-tools/render.py
          git diff --exit-code || {
            echo "SKILL.md delivery blocks are stale — run: make render"; exit 1; }
