name: review-snapshot
on:
  push:
    branches: [review/research-design-20260917]
    paths: [.github/workflows/review-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deaf40e110bbdb06542e4f004dc94ca6e0fa7f38
          persist-credentials: false
      - name: Archive reviewed baseline
        run: git archive --format=tar HEAD | gzip -n > research-baseline.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: research-baseline-deaf40e
          path: research-baseline.tar.gz
          retention-days: 1
